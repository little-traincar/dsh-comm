# dsh-comm 组合包 patch：安装进 profile 时由 dsh 自动应用本层。
#
# 该插件只挂载一个 Host 入口（lib/index.js）：
#   - 注册串口 / TCP / UDP 的 LinkManager 与模型工具
#   - 在 webServer 上挂 /comm 前缀路由：内嵌 UI + 轮询 API
#   - 向 DSH index 注入 window.__DSH_COMM__（base + 本次进程 token），
#     供 Client 半边的 iframe 读取
# Client 半边由 package.json 的 dsh.client 自动组合，不需要单独 insert。
- insert:
    - id: dsh-comm
      name: 'dsh-comm'
      config:
        maxLogEntries: 2000
        maxReadEntries: 200
        # 每条链路日志的原始字节上限（默认 4 MiB），超出丢最旧并计入 dropped
        maxLogBytes: 4194304
        # 留空则每次启动随机生成；调试期可固定一个值
        uiToken: ''
        # 无规则自动回复：转给哪个 DSH 会话；留空 = 自动创建/复用专用会话
        aiReplySession: ''
        # 默认 true：自动创建「dsh-comm 自动回复」专用会话，不注入主对话；
        # false：退回最近活跃会话
        aiReplyDedicatedSession: true
        # 无规则自动回复的合并窗口（毫秒）
        aiReplyDebounceMs: 300
        # 防回环：自己发出的数据在窗口内原样回来视为回显；两次转发最小间隔；每分钟上限
        aiReplyEchoSuppressMs: 300
        aiReplyCooldownMs: 500
        aiReplyMaxPerMinute: 30
        # 会话 list/create/rename/prompt 的超时（毫秒）
        aiReplyTimeoutMs: 15000
        # 转发后多久没任何发送算一次"无响应"；连续两次自动解除绑定并重建专用会话
        aiReplyLivenessMs: 30000
