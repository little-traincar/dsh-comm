<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 通信调试台</title>
<style>
  :root{
    --bg:#0B0E14; --panel:#121722; --card:#171D2A; --line:#232B3B; --line-soft:#1B2231;
    --text:#E6EAF2; --muted:#8B94A7; --dim:#5C6678;
    --blue:#4D6BFE; --cyan:#38BDF8;
    --green:#22C55E; --yellow:#F59E0B; --red:#EF4444;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:ui-sans-serif,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:12.5px/1.5 var(--sans);overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .head{flex:none;height:42px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--line-soft)}
  .head .plug{width:24px;height:24px;border-radius:7px;background:#182338;display:grid;place-items:center;color:var(--cyan)}
  .head .plug svg{width:13px;height:13px}
  .head .title{font-weight:600;font-size:13px}
  .head .state{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .led{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .led.on{background:var(--green);box-shadow:0 0 8px #22c55e88;animation:pulse 1.8s ease-in-out infinite}
  .led.err{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .icon-btn{width:26px;height:26px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:grid;place-items:center}
  .icon-btn:hover{background:#1C2433;color:var(--text)}
  .icon-btn svg{width:14px;height:14px}
  .theme-btn .ico-moon{display:none}
  html[data-theme="light"] .theme-btn .ico-sun{display:none}
  html[data-theme="light"] .theme-btn .ico-moon{display:block}
  .tabs{flex:none;display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line-soft)}
  .tabs button{flex:1;height:33px;border:0;background:transparent;color:var(--muted);font-size:11.5px;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.active{color:#C9D6FF;border-bottom-color:var(--blue)}
  .cfg{display:none;flex:none;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
  .cfg.active{display:flex}
  .cfg .hint{color:var(--dim);font-size:10.5px;width:100%;margin-top:-2px}
  .select{position:relative;display:flex;align-items:center;height:28px;background:#0F1420;border:1px solid var(--line);border-radius:7px;padding:0 24px 0 8px;color:#CBD5E6;font-size:11.5px;white-space:nowrap}
  .select::after{content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:10px;pointer-events:none}
  .select select{position:absolute;inset:0;opacity:0;cursor:pointer}
  .select.port{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .select.baud{width:82px}
  .select.ip{width:96px}
  .select.enc{width:112px}
  .select.eol{height:28px;font-size:11px}
  .select:focus-within{border-color:#3A4A6B}
  .frame{color:var(--dim);font-family:var(--mono);font-size:11px}
  .mini-input{height:28px;background:#0F1420;border:1px solid var(--line);border-radius:7px;padding:0 8px;color:#CBD5E6;font-size:11.5px;font-family:var(--mono);outline:none;min-width:0}
  .mini-input:focus{border-color:#3A4A6B}
  .mini-input.port{width:62px}
  .mini-input.host{width:126px}
  .mini-input.interval{width:56px}
  .colon{color:var(--dim);font-family:var(--mono);font-size:11px}
  .connect-btn{margin-left:auto;height:28px;padding:0 10px;border-radius:7px;border:1px solid #35508F;background:#16203A;color:#9FB4FF;font-size:11.5px}
  .connect-btn:hover{background:#1B2848}
  .connect-btn.close{border-color:#5A3036;background:#251318;color:#FFB4B4}
  .tools{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:26px}
  .seg button{border:0;background:#0F1420;color:var(--muted);padding:0 9px;font-size:11.5px}
  .seg button.active{background:#1E2B4D;color:#C9D6FF}
  .toggle{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;cursor:pointer;user-select:none;white-space:nowrap}
  .toggle input{display:none}
  .toggle i{width:24px;height:14px;border-radius:8px;background:#2A3242;position:relative;transition:.15s}
  .toggle i::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#8B94A7;top:2px;left:2px;transition:.15s}
  .toggle input:checked+i{background:#2B3C75}
  .toggle input:checked+i::after{left:12px;background:#8FA6FF}
  .filter{flex:1;min-width:80px;height:26px;background:#0F1420;border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:11.5px;color:#CBD5E6;outline:none}
  .filter::placeholder{color:var(--dim)}
  .filter:focus{border-color:#3A4A6B}
  .ghost-btn{border:1px solid var(--line);background:#151B27;color:var(--muted);border-radius:7px;height:26px;padding:0 9px;font-size:11.5px}
  .ghost-btn:hover{background:#1C2433;color:var(--text)}
  .log-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#0C111A;border-bottom:1px solid var(--line-soft)}
  .log{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;overflow-anchor:none;padding:8px 0 10px;font-family:var(--mono);font-size:11.5px;line-height:1.8}
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:#222b3c;border-radius:8px}
  .line{display:flex;gap:7px;padding:0 12px;white-space:pre-wrap;word-break:break-all}
  .line:hover{background:#111827}
  .ts{color:#55617A;flex:none;font-size:10.5px;padding-top:1px}
  .tag{flex:none;width:26px;text-align:center;font-size:10px;font-weight:700;border-radius:3px;height:14px;line-height:14px;margin-top:3px}
  .tag.rx{color:#93A6C8;background:#1A2232}
  .tag.tx{color:#8FB4FF;background:#17233F}
  .tag.sys{color:#7EE2A8;background:#13261B}
  .rawbadge{flex:none;font-size:9px;font-weight:700;color:#9FB4FF;background:#1B2440;border:1px solid #2A3560;border-radius:3px;padding:0 4px;height:14px;line-height:13px;margin-top:3px}
  .src,.dst{flex:none;font-size:10px;border-radius:3px;padding:0 4px;height:14px;line-height:14px;margin-top:3px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
  .src{color:#6E8AB8;background:#121B2B}
  .dst{color:#8FA6FF;background:#18203B}
  .line .msg{flex:1;min-width:0;color:#C9D2E3}
  .line.info .msg{color:#BFC9DB}
  .line.warn .msg{color:#F2C66D}
  .line.error .msg{color:#FF9B9B}
  .line.ok .msg{color:#7EE2A8;font-weight:600}
  .line.dim .msg{color:#7C879B}
  .line.bad .msg{text-decoration:underline dotted #F59E0B}
  .hexmode .line .msg{color:#8FA1BF;letter-spacing:.3px}
  .jump-bottom{position:absolute;right:16px;bottom:12px;height:24px;padding:0 9px;border-radius:12px;border:1px solid #2F3E63;background:#1A2440;color:#B9C8FF;font-size:10.5px;display:none;box-shadow:0 4px 12px #00000055}
  .jump-bottom.show{display:block}
  .auto-panel{flex:none;border-bottom:1px solid var(--line-soft);background:#0E1522;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto}
  .auto-panel[hidden]{display:none}
  .auto-head{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:10.5px}
  .auto-head b{color:#AEB9CC;font-weight:600;font-size:11px}
  .auto-head .spacer{flex:1}
  .auto-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim)}
  .auto-row select,.auto-row input[type=text],.auto-row input[type=number]{height:22px;background:#0B1220;border:1px solid var(--line);border-radius:4px;color:#C9D2E3;font-size:10.5px;padding:0 5px;min-width:0}
  .auto-row .grow{flex:1;min-width:60px}
  .auto-row .w60{width:60px;flex:none}
  .auto-empty{color:var(--dim);font-size:10.5px;padding:2px 0}
  .select.serial{width:74px}
  .select.serial.wide{width:96px}
  .sig{display:inline-flex;align-items:center;gap:5px}
  .sig[hidden]{display:none}
  .sig-btn{height:19px;padding:0 6px;border:1px solid var(--line);background:#121A28;color:var(--dim);border-radius:5px;font-size:10px;font-family:var(--mono);line-height:17px}
  .sig-btn:hover{background:#1C2433;color:var(--text)}
  .sig-btn.active{border-color:#35508F;background:#16203A;color:#9FB4FF}
  .sig-btn:disabled{opacity:.45;cursor:not-allowed}
  .timer-stat{color:var(--cyan);font-size:10px;font-family:var(--mono);white-space:nowrap}
  .trow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-height:28px}
  .trow .grow{flex:1}
  .trow .mini-input{height:28px}
  .tlabel{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .tradio{display:flex;align-items:center;gap:4px;font-size:11px;color:#C6D0E2;cursor:pointer;white-space:nowrap}
  .tradio input{accent-color:#4D6BFE}
  .tstep{display:grid;grid-template-columns:70px minmax(0,1fr) 64px 22px;gap:6px;align-items:center;margin-bottom:6px}
  .tstep .mini-input{height:28px}
  .tstep .qmode{height:28px;background:#0F1420;border:1px solid var(--line);border-radius:7px;color:#CBD5E6;font-size:11px;padding:0 3px;outline:none}
  .tstep .tdel{border:0;background:transparent;color:#7A869C;font-size:15px;height:28px;border-radius:6px;padding:0}
  .tstep .tdel:hover{background:#3A1F26;color:#FF9B9B}
  .send{flex:none;padding:9px 12px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line-soft)}
  .quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px}
  .quick-label{color:var(--dim);font-size:10.5px}
  .chip{border:1px solid var(--line);background:#101725;color:#9FB0CE;border-radius:5px;padding:0 7px;font-size:10.5px;height:22px;line-height:20px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .chip:hover{background:#18243A;color:#CFE0FF}
  .chip.edit{color:#8FA6FF;border-color:#2F3E63;background:#141D33}
  .quick-empty{color:var(--dim);font-size:10.5px}
  .send-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .send-hint{flex:1;min-width:90px;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .send-row{display:flex;gap:7px;align-items:center}
  .send-row .input{flex:1;min-width:0;height:30px;background:#0F1420;border:1px solid var(--line);border-radius:7px;padding:0 9px;color:#CBD5E6;font-family:var(--mono);font-size:11.5px;outline:none}
  .send-row .input::placeholder{color:var(--dim);font-family:var(--sans)}
  .send-row .input:focus{border-color:#3A4A6B}
  .send-row .input.invalid{border-color:#7F3A3A;box-shadow:0 0 0 2px #ef444422}
  .send-primary{height:30px;padding:0 12px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-size:12px;font-weight:600}
  .send-primary:hover{background:#5C78FF}
  .send-primary:disabled{opacity:.45;cursor:not-allowed}
  .ms-label{color:var(--dim);font-size:10px}
  .status{flex:none;min-height:28px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 12px;color:var(--dim);font-size:10.5px;font-family:var(--mono);white-space:normal;overflow-x:hidden}
  .status b{color:#AEB9CC;font-weight:500}
  .status .sep{color:#2A3346}
  .status .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .rec{color:var(--yellow);display:none}
  .rec.show{display:inline}
  .pause-stat{color:#F2C66D;font-weight:500}
  .pause-stat[hidden]{display:none}
  .link-btn{border:0;background:transparent;color:#6E7C96;font-size:10.5px;padding:0}
  .link-btn:hover{color:#AEBDFF}
  .log-menu{position:absolute;top:38px;right:46px;z-index:60;display:none;flex-direction:column;min-width:214px;background:#141A26;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px #00000077;padding:4px}
  .log-menu.show{display:flex}
  .log-menu button{border:0;background:transparent;color:#C6D0E2;text-align:left;font-size:11.5px;padding:7px 9px;border-radius:6px;white-space:nowrap}
  .log-menu button:hover{background:#1E2A44;color:#fff}
  .log-menu .sep{height:1px;background:var(--line-soft);margin:3px 4px}
  .modal-backdrop{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:12px;background:#00000088;backdrop-filter:blur(2px)}
  .modal-backdrop.show{display:flex}
  .modal{width:100%;max-width:430px;max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;background:#141A26;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px #000000aa}
  .modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line-soft);font-weight:600;font-size:12.5px}
  .modal-head span{color:var(--dim);font-weight:400;font-size:10.5px}
  .modal-body{min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .modal-actions{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line-soft)}
  .modal-actions .grow{flex:1}
  .qrow{display:grid;grid-template-columns:62px minmax(0,1fr) 54px 22px;gap:6px;align-items:center}
  .qrow .mini-input{height:28px}
  .qrow .qmode{height:28px;background:#0F1420;border:1px solid var(--line);border-radius:7px;color:#CBD5E6;font-size:11px;padding:0 3px;outline:none}
  .qrow .qdel{border:0;background:transparent;color:#7A869C;font-size:15px;height:28px;border-radius:6px;padding:0}
  .qrow .qdel:hover{background:#3A1F26;color:#FF9B9B}
  .toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#1B2440;border:1px solid #2F3E63;color:#C9D6FF;font-size:11px;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;white-space:nowrap}
  .toast.show{opacity:1}
  .boot-error{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--muted);font-size:12px;text-align:center;line-height:1.8}
  .boot-error.show{display:flex}
  html[data-theme="dark"]{color-scheme:dark}
  /* ── 浅色主题：深色默认配色完全不动，这里只覆盖浅色下的取值 ── */
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#F5F7FA; --panel:#FFFFFF; --card:#F2F4F8; --line:#DDE3EC; --line-soft:#EAEEF4;
    --text:#1B2333; --muted:#5F6B7D; --dim:#8E99AA;
    --blue:#4D6BFE; --cyan:#0891CC;
    --green:#12A150; --yellow:#C77700; --red:#D92D20;
  }
  html[data-theme="light"] .head .plug{background:#E8EDFF;color:#3B5BDB}
  html[data-theme="light"] .icon-btn:hover{background:#EDF1F7;color:var(--text)}
  html[data-theme="light"] .tabs button.active{color:#3B5BDB}
  html[data-theme="light"] .select,
  html[data-theme="light"] .mini-input,
  html[data-theme="light"] .qrow .qmode,
  html[data-theme="light"] .tstep .qmode,
  html[data-theme="light"] .filter,
  html[data-theme="light"] .send-row .input,
  html[data-theme="light"] .auto-row select,
  html[data-theme="light"] .auto-row input[type=text],
  html[data-theme="light"] .auto-row input[type=number]{background:#FFFFFF;color:var(--text);border-color:var(--line)}
  html[data-theme="light"] .select:focus-within,
  html[data-theme="light"] .mini-input:focus,
  html[data-theme="light"] .filter:focus,
  html[data-theme="light"] .send-row .input:focus{border-color:#9DB1FF}
  html[data-theme="light"] .send-row .input.invalid{border-color:#E5A3A0;box-shadow:0 0 0 2px #D92D2022}
  html[data-theme="light"] .connect-btn{border-color:#BAC8FF;background:#EEF3FF;color:#2F4BEA}
  html[data-theme="light"] .connect-btn:hover{background:#E3EAFF}
  html[data-theme="light"] .connect-btn.close{border-color:#F3C1BE;background:#FFF2F2;color:#D92D20}
  html[data-theme="light"] .seg button{background:#F2F4F8;color:#5F6B7D}
  html[data-theme="light"] .seg button.active{background:#E4EAFF;color:#2F4BEA}
  html[data-theme="light"] .toggle i{background:#D3D9E2}
  html[data-theme="light"] .toggle i::after{background:#FFFFFF}
  html[data-theme="light"] .toggle input:checked+i{background:#4D6BFE}
  html[data-theme="light"] .toggle input:checked+i::after{background:#FFFFFF}
  html[data-theme="light"] .ghost-btn{background:#F2F4F8;color:#475467}
  html[data-theme="light"] .ghost-btn:hover{background:#E9EEF5;color:var(--text)}
  html[data-theme="light"] .log-wrap{background:#FFFFFF}
  html[data-theme="light"] .log::-webkit-scrollbar-thumb{background:#D3D9E2}
  html[data-theme="light"] .log::-webkit-scrollbar-thumb:hover{background:#B9C2CF}
  html[data-theme="light"] .ts{color:#8E99AA}
  html[data-theme="light"] .tag.rx{color:#4B6A99;background:#EAF0FA}
  html[data-theme="light"] .tag.tx{color:#2F4BEA;background:#E8EDFF}
  html[data-theme="light"] .tag.sys{color:#0F7B4A;background:#E7F6EE}
  html[data-theme="light"] .rawbadge{color:#2F4BEA;background:#EEF3FF;border-color:#C9D6FF}
  html[data-theme="light"] .src{color:#5C77A8;background:#EEF3FB}
  html[data-theme="light"] .dst{color:#3B5BDB;background:#E9EEFF}
  html[data-theme="light"] .line .msg{color:#25324A}
  html[data-theme="light"] .line.info .msg{color:#2A3A55}
  html[data-theme="light"] .line.warn .msg{color:#B45309}
  html[data-theme="light"] .line.error .msg{color:#D92D20}
  html[data-theme="light"] .line.ok .msg{color:#0F7B4A}
  html[data-theme="light"] .line.dim .msg{color:#7A8598}
  html[data-theme="light"] .line.bad .msg{text-decoration-color:#D97706}
  html[data-theme="light"] .hexmode .line .msg{color:#4A5A78}
  html[data-theme="light"] .line:hover{background:#F4F6FA}
  html[data-theme="light"] .jump-bottom{border-color:#C9D6FF;background:#EEF3FF;color:#2F4BEA;box-shadow:0 4px 12px rgba(15,23,42,.12)}
  html[data-theme="light"] .auto-panel{background:#F7F9FC}
  html[data-theme="light"] .auto-head b{color:#475467}
  html[data-theme="light"] .sig-btn{background:#F2F4F8;color:#5F6B7D}
  html[data-theme="light"] .sig-btn:hover{background:#E9EEF5;color:var(--text)}
  html[data-theme="light"] .sig-btn.active{border-color:#BAC8FF;background:#EEF3FF;color:#2F4BEA}
  html[data-theme="light"] .tradio{color:#25324A}
  html[data-theme="light"] .chip{background:#F2F4F8;color:#475467}
  html[data-theme="light"] .chip:hover{background:#E9EEF5;color:var(--text)}
  html[data-theme="light"] .chip.edit{color:#2F4BEA;border-color:#C9D6FF;background:#EEF3FF}
  html[data-theme="light"] .status b{color:#475467}
  html[data-theme="light"] .status .sep{color:#D5DAE3}
  html[data-theme="light"] .rec{color:#C77700}
  html[data-theme="light"] .pause-stat{color:#B45309}
  html[data-theme="light"] .link-btn{color:#7A8598}
  html[data-theme="light"] .link-btn:hover{color:#2F4BEA}
  html[data-theme="light"] .log-menu{background:#FFFFFF;box-shadow:0 10px 28px rgba(15,23,42,.18)}
  html[data-theme="light"] .log-menu button{color:#25324A}
  html[data-theme="light"] .log-menu button:hover{background:#F2F4F8;color:var(--text)}
  html[data-theme="light"] .modal-backdrop{background:rgba(16,24,40,.35)}
  html[data-theme="light"] .modal{background:#FFFFFF;box-shadow:0 20px 50px rgba(15,23,42,.25)}
  html[data-theme="light"] .toast{background:#FFFFFF;border-color:#DDE3EC;color:#25324A;box-shadow:0 6px 18px rgba(15,23,42,.15)}
  html[data-theme="light"] .qrow .qdel,
  html[data-theme="light"] .tstep .tdel{color:#8E99AA}
  html[data-theme="light"] .qrow .qdel:hover,
  html[data-theme="light"] .tstep .tdel:hover{background:#FFF2F2;color:#D92D20}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <span class="plug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v5"/></svg></span>
    <span class="title">通信调试台</span>

      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.1 8.1 0 1 1 11.2 3a6.4 6.4 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="logBtn" title="日志：录制 / 导出">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7 9l5 5 5-5"/><path d="M5 21h14"/></svg>
    </button>
  </header>

  <div class="tabs" id="modeTabs">
    <button class="active" data-mode="serial">串口</button>
    <button data-mode="tcpServer">TCP 服务端</button>
    <button data-mode="tcpClient">TCP 客户端</button>

  </div>

  <div class="cfg active" id="cfgSerial">
    <label class="select port" title="串口">
      <span id="serialLabel">选择串口…</span>

    </label>
    <label class="select baud" title="波特率">
      <span id="baudLabel">115200</span>
      <select id="serialBaud">
        <option>9600</option><option>57600</option><option>115200</option><option>460800</option><option>921600</option><option>2000000</option>
      </select>
    </label>
    <label class="select serial" title="数据位">
      <span id="dataBitsLabel">8</span>
      <select id="serialDataBits"><option value="8">8</option><option value="7">7</option><option value="6">6</option><option value="5">5</option></select>
    </label>
    <label class="select serial" title="校验位">
      <span id="parityLabel">N</span>
      <select id="serialParity"><option value="none">N</option><option value="even">E</option><option value="odd">O</option><option value="mark">M</option><option value="space">S</option></select>
    </label>
    <label class="select serial" title="停止位">
      <span id="stopBitsLabel">1</span>
      <select id="serialStopBits"><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option></select>
    </label>
    <label class="select serial wide" title="流控">
      <span id="flowLabel">无</span>
      <select id="serialFlow"><option value="none">无</option><option value="rtscts">RTS-CTS</option><option value="xonxoff">XON-XOFF</option></select>
    </label>
    <label class="toggle" title="DTR"><input type="checkbox" id="serialDtr" checked><i></i>DTR</label>
    <label class="toggle" title="RTS"><input type="checkbox" id="serialRts" checked><i></i>RTS</label>
    <label class="toggle" title="断线自动重连"><input type="checkbox" id="serialAutoReconnect" checked><i></i>断线重连</label>
    <span class="frame" id="serialFrame" title="当前串口帧格式">8N1</span>
    <button class="connect-btn" id="serialBtn">打开</button>

  </div>

  <div class="cfg" id="cfgTcpServer">
    <input class="mini-input host" id="tsHost" value="127.0.0.1" spellcheck="false"
           title="监听地址：127.0.0.1 仅本机，0.0.0.0 所有网卡，也可填具体网卡 IP，如 192.168.1.10">

  <div class="cfg" id="cfgTcpClient">

    <span class="colon">本地</span>
    <input class="mini-input host" id="udpLocalHost" value="0.0.0.0" spellcheck="false"

  <div class="tools">

    <button class="ghost-btn" id="autoBtn" title="按规则自动回复收到的数据">自动回复</button>
    <button class="ghost-btn" id="clearBtn" title="清空当前链路的日志（Host 侧一并清除，重进面板不会回来）">清空日志</button>
    <input class="filter" id="filterInput" placeholder="过滤…">
  </div>

  <div class="auto-panel" id="autoPanel" hidden>
    <div class="auto-head">
      <b>自动回复</b>
      <label class="toggle"><input type="checkbox" id="autoEnable"><i></i>启用</label>
      <span id="autoHint">收到匹配内容就自动回复，规则按链路保存</span>

      <input type="number" id="autoDebounce" min="0" max="5000" step="50" value="300" class="w60" title="毫秒（0-5000）">

  <div class="log-wrap">

  <div class="send">
    <div class="quick" id="quickRow"><span class="quick-label">快捷</span></div>
    <div class="send-top">
      <div class="seg" id="sendSeg">

      <span class="timer-stat" id="timerStat"></span>
    </div>
    <div class="send-row">
      <input class="input" id="sendInput" placeholder="输入要发送的数据…（回车发送）">

  <div class="status">
    <span>RX <b id="rxBytes">0 B</b></span>

    <span>TX <b id="txBytes">0 B</b></span>
    <span class="sep">·</span>
    <span id="statCfg">—</span>

      <button class="sig-btn" id="sigDtr" title="DTR 电平（点击切换）">DTR</button>

    </span>

    <span class="sep">·</span>
    <span id="peerStat">对端 0</span>

      <button class="link-btn" id="saveBtn">导出日志</button>

  <div class="log-menu" id="logMenu">

  <div class="modal-backdrop" id="quickBackdrop">

  <div class="modal-backdrop" id="timerBackdrop">

      <div class="modal-body">
        <div class="trow">
          <label class="tradio"><input type="radio" name="timerKind" id="timerKindPeriodic" value="periodic" checked> 周期</label>
          <label class="tradio"><input type="radio" name="timerKind" id="timerKindSequence" value="sequence"> 序列</label>

        <div id="tkPeriodic">

            <span class="tlabel">间隔</span>
            <input class="mini-input interval" id="timerInterval" value="1000">
            <span class="ms-label">ms</span>
            <span class="tlabel">重复</span>
            <input class="mini-input interval" id="timerRepeat" value="0">
            <span class="ms-label">次（0=一直）</span>
          </div>
          <div class="trow">
            <span class="tlabel">载荷</span>
            <input class="mini-input grow" id="timerPayload" placeholder="要发送的内容">
            <select class="qmode" id="timerPayloadMode"><option value="text">文本</option><option value="hex">HEX</option></select>
          </div>
        </div>

        <div id="tkSequence" hidden>
          <div class="trow">
            <span class="tlabel">步骤（延迟 / 载荷 / 模式）</span>

            <label class="toggle"><input type="checkbox" id="timerLoop"><i></i>循环</label>
            <span class="tlabel">重复</span>

  <div class="toast" id="toast"></div>
  <div class="boot-error" id="bootError"></div>
</div>

<script>
(function () {
  'use strict'

  const params = new URLSearchParams(location.search)
  const TOKEN = params.get('token') || ''
  const ENCODINGS = [
    ['utf-8', 'UTF-8'], ['gbk', 'GBK'], ['gb18030', 'GB18030'], ['big5', 'Big5'],
    ['shift_jis', 'Shift-JIS'], ['euc-kr', 'EUC-KR'], ['windows-1252', 'Windows-1252'],
  ]
  const MODE_LABEL = { serial: '串口', tcpServer: 'TCP 服务端', tcpClient: 'TCP 客户端', udp: 'UDP' }
  const state = {
    mode: 'serial', hex: false, sendHex: false, enc: 'gbk',
    ts: true, auto: true, paused: false, filter: '',
  }
  const links = {}
  const linkByMode = { serial: null, tcpServer: null, tcpClient: null, udp: null }
  const logs = new Map()
  let cursor = 0
  let polling = false
  let followTail = true
  // 增量渲染状态：view.items 按顺序记录日志 DOM 行 → 条目 q，追加/裁剪时同步 DOM，避免整块重建。
  const view = { linkId: null, lastQ: 0, items: [] }
  let lastPauseActionAt = 0
  let recording = false
  let recorded = []
  let toastTimer = null
  let timerDraftSteps = []
  let lastTimerSpec = null
  let currentTimer = null
  let quickDraft = []
  let serialPorts = []

  const $ = (id) => document.getElementById(id)
  const logEl = $('log')

  if (!TOKEN) {
    const boot = $('bootError')
    boot.classList.add('show')
    boot.textContent = '缺少访问 token：请从 DSH 右栏的「通信」tab 打开本页面。'
    return
  }

  /* ── 主题：深色为默认；顶部开关手动切换并记忆。手动选过之后不再跟随 DSH 主题消息 ── */
  const THEME_KEY = 'dsh-comm.theme'
  let themePref = null
  try { themePref = localStorage.getItem(THEME_KEY) } catch { themePref = null }
  if (themePref !== 'dark' && themePref !== 'light') themePref = null
  const urlTheme = params.get('theme')
  const themeOverride = urlTheme === 'dark' || urlTheme === 'light' ? urlTheme : null
  function applyTheme(value, persist) {
    document.documentElement.dataset.theme = value
    if (persist) { try { localStorage.setItem(THEME_KEY, value) } catch { /* ignore */ } }
    const btn = $('themeBtn')
    if (btn) btn.title = value === 'light' ? '主题：浅色（点击切换为深色）' : '主题：深色（点击切换为浅色）'
  }
  applyTheme(themeOverride || themePref || 'dark')
  $('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
    themePref = next
    applyTheme(next, true)
  })
  // Client 半边每秒 postMessage 一次当前主题；用户没手动选过时跟随 DSH 深/浅色
  window.addEventListener('message', (event) => {
    const data = event.data
    if (!data || data.type !== 'dsh-comm:theme') return
    if (themePref || themeOverride) return
    applyTheme(data.dark ? 'dark' : 'light')
  })

  /* ── API ── */
  async function api(path, method = 'GET', body) {
    const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN)
    const res = await fetch(url, {
      method,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    })
    const data = await res.json().catch(() => null)
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status))
    return data
  }

  function toast(message) {
    const el = $('toast')
    el.textContent = message
    el.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600)
  }

  /* ── 编码 / HEX ── */
  function decodeBytes(bytes, encoding) {
    try {
      const text = new TextDecoder(encoding, { fatal: false }).decode(bytes)
      return { text, bad: text.indexOf('\uFFFD') !== -1 }
    } catch {
      return { text: '[不支持的编码：' + encoding + ']', bad: true }
    }
  }
  function hexOf(bytes) {
    const out = []
    for (let i = 0; i < bytes.length; i += 1) out.push(bytes[i].toString(16).padStart(2, '0').toUpperCase())
    return out.join(' ')
  }
  function b64ToBytes(b64) {
    const bin = atob(b64)
    const out = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i)
    return out
  }
  function fmtBytes(n) {
    if (n < 1024) return n + ' B'
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'
    return (n / 1048576).toFixed(1) + ' MB'
  }
  function fmtTime(ms) {
    const d = new Date(ms)
    const p = (n, w) => String(n).padStart(w, '0')
    return p(d.getHours(), 2) + ':' + p(d.getMinutes(), 2) + ':' + p(d.getSeconds(), 2) + '.' + p(d.getMilliseconds(), 3)
  }
  function activeLinkId() { return linkByMode[state.mode] }
  function activeLink() { const id = activeLinkId(); return id ? links[id] : undefined }

  /* ── 串口帧格式 / 参数 ── */
  const PARITY_LABEL = { none: 'N', even: 'E', odd: 'O', mark: 'M', space: 'S' }
  const FLOW_LABEL = { none: '无', rtscts: 'RTS-CTS', xonxoff: 'XON-XOFF' }
  let serialPrefsFromStorage = false

  function setSerialBaud(value) {
    const text = String(value)
    const sel = $('serialBaud')
    if (!Array.prototype.some.call(sel.options, (opt) => opt.value === text)) {
      const opt = document.createElement('option')
      opt.value = text
      opt.textContent = text
      sel.appendChild(opt)
    }
    sel.value = text
    $('baudLabel').textContent = text
  }

  function serialFrameText() {
    const bits = $('serialDataBits').value
    const parity = PARITY_LABEL[$('serialParity').value] || 'N'
    const stop = $('serialStopBits').value
    const flow = $('serialFlow').value
    return bits + parity + stop + (flow === 'rtscts' ? '+CTS' : flow === 'xonxoff' ? '+XON' : '')
  }

  function updateSerialFrame() {
    $('dataBitsLabel').textContent = $('serialDataBits').value
    $('parityLabel').textContent = PARITY_LABEL[$('serialParity').value] || 'N'
    $('stopBitsLabel').textContent = $('serialStopBits').value
    $('flowLabel').textContent = FLOW_LABEL[$('serialFlow').value] || '无'
    $('serialFrame').textContent = serialFrameText()
    if (!activeLink() && state.mode === 'serial') $('statCfg').textContent = linkConfigText()
  }

  function applySerialDefaults(defaults) {
    if (!defaults || typeof defaults !== 'object') return
    if (defaults.baudRate) setSerialBaud(defaults.baudRate)
    if (defaults.dataBits !== undefined) $('serialDataBits').value = String(defaults.dataBits)
    if (defaults.parity) $('serialParity').value = String(defaults.parity)
    if (defaults.stopBits !== undefined) $('serialStopBits').value = String(defaults.stopBits)
    if (defaults.flowControl) $('serialFlow').value = String(defaults.flowControl)
    if (typeof defaults.dtr === 'boolean') $('serialDtr').checked = defaults.dtr
    if (typeof defaults.rts === 'boolean') $('serialRts').checked = defaults.rts
    if (typeof defaults.autoReconnect === 'boolean') $('serialAutoReconnect').checked = defaults.autoReconnect
    updateSerialFrame()
  }

  /* ── 串口信号（DTR / RTS / 重连） ── */
  function applySerialSignals(signals) {
    if (!signals) return
    $('sigDtr').classList.toggle('active', Boolean(signals.dtr))
    $('sigRts').classList.toggle('active', Boolean(signals.rts))
  }

  function updateSerialSignals() {
    const link = activeLink()
    const open = Boolean(link && link.open)
    const show = Boolean(link && link.type === 'serial' && open)
    $('serialSignals').hidden = !show
    const serial = link && link.serial ? link.serial : null
    if (show && serial && serial.signals) applySerialSignals(serial.signals)
    const reconnecting = Boolean(serial && serial.reconnecting)
    $('serialReconnect').textContent = reconnecting ? '重连中…' : '重连'
    $('serialReconnect').disabled = reconnecting
    $('sigDtr').disabled = !show
    $('sigRts').disabled = !show
    $('sigPulseDtr').disabled = !show
  }

  async function serialAction(body, okText) {
    const id = activeLinkId()
    if (!id) { toast('请先打开串口'); return }
    try {
      const data = await api('/comm/api/serial', 'POST', { link: id, ...body })
      if (data && data.link) links[data.link.id] = data.link
      if (data && data.signals) applySerialSignals(data.signals)
      updateSerialSignals()
      if (okText) toast(okText)
    } catch (error) {
      toast('串口操作失败：' + ((error && error.message) || error))
    }
  }

  function toUI(entry) {
    return {
      q: entry.q, t: entry.t, dir: entry.d, peer: entry.p || '',
      bytes: b64ToBytes(entry.b), x: Boolean(entry.x),
    }
  }

  /* ── 日志渲染 ── */
  function hexLine(item) {
    if (item.dir === 'tx') return '> ' + hexOf(item.bytes)
    return hexOf(item.bytes)
  }
  function makeLine(item) {
    const decoded = decodeBytes(item.bytes, state.enc)
    const useHex = state.hex || item.x
    const text = useHex ? hexLine(item) : decoded.text
    const full = useHex ? hexOf(item.bytes) : decoded.text
    if (state.filter && full.toLowerCase().indexOf(state.filter) === -1) return null

    const div = document.createElement('div')
    div.className = 'line ' + (item.dir === 'sys' ? 'dim' : 'info') + (decoded.bad && !useHex ? ' bad' : '')
    div.dataset.q = String(item.q)
    const ts = document.createElement('span')
    ts.className = 'ts'
    ts.textContent = fmtTime(item.t)
    if (!state.ts) ts.style.display = 'none'
    const tag = document.createElement('span')
    tag.className = 'tag ' + item.dir
    tag.textContent = item.dir.toUpperCase()
    div.appendChild(ts)
    div.appendChild(tag)
    if (item.x && !state.hex) {
      const badge = document.createElement('span')
      badge.className = 'rawbadge'
      badge.textContent = 'HEX'
      div.appendChild(badge)
    }
    if (item.peer) {
      const peer = document.createElement('span')
      peer.className = item.dir === 'tx' ? 'dst' : 'src'
      peer.textContent = item.peer
      peer.title = item.peer
      div.appendChild(peer)
    }
    const msg = document.createElement('span')
    msg.className = 'msg'
    msg.textContent = text
    div.appendChild(msg)
    return div
  }

  function renderLog() {
    const id = activeLinkId()
    const list = id ? (logs.get(id) || []) : []
    const prevTop = logEl.scrollTop
    const wasFollowing = followTail
    logEl.innerHTML = ''
    logEl.classList.toggle('hexmode', state.hex)
    const items = []
    for (const item of list) {
      const line = makeLine(item)
      if (!line) continue
      logEl.appendChild(line)
      items.push({ q: item.q, el: line })
    }
    if (!list.length) {
      const empty = document.createElement('div')
      empty.className = 'line dim'
      empty.style.padding = '10px 12px'
      empty.dataset.empty = '1'
      empty.textContent = id ? '暂无数据，等待收发…' : '当前模式未打开链路。'
      logEl.appendChild(empty)
    }
    view.linkId = id || null
    view.lastQ = list.length ? list[list.length - 1].q : 0
    view.items = items
    if (state.auto && wasFollowing) {
      logEl.scrollTop = logEl.scrollHeight
      followTail = true
    } else {
      logEl.scrollTop = prevTop
    }
    updateJump()
    updateCounters()
  }

  // 轮询追加：只把新条目接到末尾，不再整块重建 DOM。
  // 日志达到上限后旧条目会被裁掉（Host 条数/字节上限 + 前端 2000 条上限）。
  // 这里同步删掉对应的旧行，并在「不跟随最新」时按视口顶部那一行把滚动位置摆回去，
  // 否则关了自动滚动后日志内容仍会随旧行被裁掉而自己往上跑（看起来像还在滚动）。
  // 用「锚点行」而不是累加 offsetHeight，是因为 offsetHeight/offsetTop 都是整数像素，
  // 逐行累加会在 2000 行规模下累积舍入误差（表现为每次裁剪漂一行）。
  // 同时 .log 上关闭了 CSS scroll-anchoring（overflow-anchor:none），
  // 否则浏览器会再自动补偿一次，和这里的 scrollTop 补偿叠加，位置会跳两倍。
  function appendLog() {
    const id = activeLinkId()
    const list = id ? (logs.get(id) || []) : []
    if (!id || view.linkId !== id || logEl.querySelector('[data-empty]')) { renderLog(); return }
    const wasFollowing = state.auto && followTail
    // 记下视口顶部那一行（锚点）以及它在视口里的偏移，DOM 变动后按它恢复。
    let anchor = null
    let anchorDelta = 0
    if (!wasFollowing) {
      for (const el of logEl.children) {
        if (el.offsetTop + el.offsetHeight > logEl.scrollTop) {
          anchor = el
          anchorDelta = el.offsetTop - logEl.scrollTop
          break
        }
      }
    }
    const firstQ = list.length ? list[0].q : Infinity
    let removedHeight = 0
    while (view.items.length && view.items[0].q < firstQ) {
      const item = view.items.shift()
      removedHeight += item.el.offsetHeight || 0
      item.el.remove()
    }
    let added = 0
    for (const entry of list) {
      if (entry.q <= view.lastQ) continue
      view.lastQ = entry.q
      const line = makeLine(entry)
      if (!line) continue
      logEl.appendChild(line)
      view.items.push({ q: entry.q, el: line })
      added += 1
    }
    if (wasFollowing) {
      logEl.scrollTop = logEl.scrollHeight
    } else if (anchor && anchor.isConnected) {
      logEl.scrollTop = Math.max(0, anchor.offsetTop - anchorDelta)
    } else if (removedHeight > 0) {
      // 锚点行自己被裁掉了（用户正在最顶上）：退化为按裁剪高度补偿。
      logEl.scrollTop = Math.max(0, logEl.scrollTop - removedHeight)
    }
    if (!wasFollowing) followTail = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 16
    if (added || removedHeight > 0) {
      updateJump()
      updateCounters()
    }
  }

  function updateJump() {
    $('jumpBottom').classList.toggle('show', !followTail && logEl.scrollHeight > logEl.clientHeight)
  }
  logEl.addEventListener('scroll', () => {
    followTail = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 16
    updateJump()
  })
  $('jumpBottom').addEventListener('click', () => {
    followTail = true
    logEl.scrollTop = logEl.scrollHeight
    updateJump()
  })

  function updateCounters() {
    const link = activeLink()
    $('rxBytes').textContent = fmtBytes(link ? link.rx : 0)
    $('txBytes').textContent = fmtBytes(link ? link.tx : 0)
    $('peerStat').textContent = '对端 ' + (link && link.peers ? link.peers.length : 0)
    const backlogBytes = link && typeof link.backlogBytes === 'number' ? link.backlogBytes : 0
    const dropped = link && typeof link.dropped === 'number' ? link.dropped : 0
    $('bufPct').textContent = '缓冲 ' + fmtBytes(backlogBytes) + ' · 丢弃 ' + dropped
    $('bufPct').title = link
      ? ('待读队列 ' + (link.backlog || 0) + ' 条 / ' + backlogBytes + ' 字节；累计丢弃 ' + dropped + ' 条 / ' + (link.droppedBytes || 0) + ' 字节（上限由 Host 的 maxLogBytes 决定）')
      : '未打开链路'
    $('statCfg').textContent = linkConfigText()
    const paused = Boolean(link && link.paused)
    const pauseStat = $('pauseStat')
    pauseStat.hidden = !paused
    if (paused) {
      const droppedBytes = typeof link.pausedDroppedBytes === 'number' ? link.pausedDroppedBytes : 0
      const droppedCount = typeof link.pausedDropped === 'number' ? link.pausedDropped : 0
      pauseStat.textContent = '⏸ 已暂停接收' + (droppedCount ? ' · 已丢弃 ' + droppedCount + ' 条 / ' + fmtBytes(droppedBytes) : '')
      pauseStat.title = '暂停期间收到的数据不会记录；点工具栏「暂停」恢复接收'
    } else {
      pauseStat.textContent = ''
      pauseStat.title = ''
    }
    updateSerialSignals()
    if (!link) applyTimerState(null)
    else if (link.timer !== undefined) applyTimerState(link.timer)
  }

  function linkConfigText() {
    const link = activeLink()
    if (link) {
      const c = link.config || {}
      if (link.type === 'serial') {
        const frame = String(c.dataBits || 8) + (PARITY_LABEL[c.parity] || 'N') + String(c.stopBits === undefined ? 1 : c.stopBits)
        return '串口 ' + c.path + ' @ ' + c.baudRate + ' ' + frame
      }
      if (link.type === 'tcpServer') return 'TCP ' + c.host + ':' + c.port
      if (link.type === 'tcpClient') return 'TCP → ' + c.host + ':' + c.port
      if (link.type === 'udp') return 'UDP ' + (c.localHost || '0.0.0.0') + ':' + c.localPort + ' → ' + c.remoteHost + ':' + c.remotePort
    }
    if (state.mode === 'serial') return $('serialBaud').value + ' ' + serialFrameText()
    if (state.mode === 'tcpServer') return 'TCP ' + ($('tsHost').value.trim() || '127.0.0.1') + ':' + $('tsPort').value
    if (state.mode === 'tcpClient') return 'TCP → ' + $('tcHost').value + ':' + $('tcPort').value
    return 'UDP ' + ($('udpLocalHost').value.trim() || '0.0.0.0') + ':' + $('udpLocal').value + ' → ' + $('udpHost').value + ':' + $('udpPort').value
  }

  /* ── 状态 / 头部 ── */
  function updateHead() {
    const link = activeLink()
    const on = Boolean(link && link.open)
    $('headLed').className = 'led' + (on ? ' on' : '')
    $('headText').textContent = link ? (on ? MODE_LABEL[link.type] + ' 已打开' : MODE_LABEL[link.type] + ' 已关闭') : MODE_LABEL[state.mode] + ' 未打开'
    syncButtons()
    renderQuick()
    updateCounters()
  }

  function syncButtons() {
    const pairs = [
      ['serialBtn', linkByMode.serial],
      ['tsBtn', linkByMode.tcpServer],
      ['tcBtn', linkByMode.tcpClient],
      ['udpBtn', linkByMode.udp],
    ]
    const labels = { serialBtn: ['打开', '关闭'], tsBtn: ['监听', '停止'], tcBtn: ['连接', '断开'], udpBtn: ['打开', '关闭'] }
    for (const [btnId, linkId] of pairs) {
      const btn = $(btnId)
      const open = Boolean(linkId && links[linkId] && links[linkId].open)
      btn.textContent = labels[btnId][open ? 1 : 0]
      btn.classList.toggle('close', open)
    }
  }

  /* ── 轮询 ── */
  async function poll() {
    if (polling) return
    polling = true
    try {
      const data = await api('/comm/api/poll?since=' + cursor)
      cursor = data.cursor || cursor
      const alive = new Set()
      for (const link of data.links) { links[link.id] = link; alive.add(link.id) }
      for (const id of Object.keys(links)) if (!alive.has(id)) delete links[id]

      // 暂停状态以 Host 上的链路为准（例如另一个面板/网页改了暂停），但刚点过开关时先别覆盖，
      // 避免 POST 还没回来、旧快照把勾选框闪回去。
      const activeSnapshot = activeLink()
      if (activeSnapshot && activeSnapshot.open && Date.now() - lastPauseActionAt > 1200
        && Boolean(activeSnapshot.paused) !== state.paused) {
        state.paused = Boolean(activeSnapshot.paused)
        $('tPause').checked = state.paused
        saveUiSettings()
      }

      let activeNew = false
      for (const entry of data.entries) {
        if (!logs.has(entry.l)) logs.set(entry.l, [])
        const item = toUI(entry)
        const arr = logs.get(entry.l)
        arr.push(item)
        if (arr.length > 2000) arr.splice(0, arr.length - 2000)
        if (recording) {
          recorded.push(item)
          $('recStat').textContent = '● 录制中 ' + recorded.length
        }
        if (entry.l === activeLinkId()) activeNew = true
      }
      if (activeNew) appendLog()
      updateHead()
      if (autoOpen && activeLinkId() !== lastAutoLink) {
        lastAutoLink = activeLinkId()
        void loadAutoRules()
      }
    } catch (error) {
      $('headLed').className = 'led err'
      $('headText').textContent = 'Host 连接失败'
      $('statCfg').textContent = String(error.message || error)
    } finally {
      polling = false
      setTimeout(poll, 300)
    }
  }

  /* ── 打开 / 关闭 ── */
  function openOptions() {
    if (state.mode === 'serial') {
      return {
        path: $('serialPort').value,
        baudRate: Number($('serialBaud').value) || 115200,
        dataBits: Number($('serialDataBits').value) || 8,
        parity: $('serialParity').value,
        stopBits: Number($('serialStopBits').value) || 1,
        flowControl: $('serialFlow').value,
        dtr: $('serialDtr').checked,
        rts: $('serialRts').checked,
        autoReconnect: $('serialAutoReconnect').checked,
      }
    }
    if (state.mode === 'tcpServer') {
      return { host: $('tsHost').value.trim() || '127.0.0.1', port: Number($('tsPort').value) }
    }
    if (state.mode === 'tcpClient') {
      return { host: $('tcHost').value.trim(), port: Number($('tcPort').value) }
    }
    return {
      localHost: $('udpLocalHost').value.trim() || '0.0.0.0',
      localPort: Number($('udpLocal').value),
      remoteHost: $('udpHost').value.trim(),
      remotePort: Number($('udpPort').value),
    }
  }

  async function toggleLink() {
    const mode = state.mode
    const id = linkByMode[mode]
    if (id && links[id] && links[id].open) {
      try {
        await api('/comm/api/close', 'POST', { link: id })
        linkByMode[mode] = null
        delete links[id]
        renderLog()
        updateHead()
        toast('已关闭 ' + MODE_LABEL[mode])
      } catch (error) { toast('关闭失败：' + error.message) }
      return
    }
    try {
      const res = await api('/comm/api/open', 'POST', { type: mode, options: openOptions() })
      linkByMode[mode] = res.link.id
      links[res.link.id] = res.link
      logs.set(res.link.id, [])
      // 打开时如果面板正处于「暂停」状态，链路一建立就同步过去，避免暂停期间还先记录一段数据。
      if (state.paused) {
        try {
          const data = await api('/comm/api/pause', 'POST', { link: res.link.id, paused: true })
          if (data && data.link) links[res.link.id] = { ...links[res.link.id], ...data.link }
        } catch (error) {
          toast('暂停设置失败：' + ((error && error.message) || error))
        }
      }
      renderLog()
      updateHead()
      toast('已打开 ' + res.link.label + (state.paused ? '（接收已暂停）' : ''))
    } catch (error) { toast('打开失败：' + error.message) }
  }

  /* ── 串口列表 ── */
  async function loadPorts() {
    try {
      const data = await api('/comm/api/ports')
      serialPorts = data.ports || []
      const sel = $('serialPort')
      sel.innerHTML = ''
      for (const port of serialPorts) {
        const opt = document.createElement('option')
        opt.value = port.path
        opt.textContent = port.path + (port.manufacturer ? ' · ' + port.manufacturer : '')
        sel.appendChild(opt)
      }
      if (!serialPorts.length) {
        const opt = document.createElement('option')
        opt.value = ''
        opt.textContent = '未发现串口'
        sel.appendChild(opt)
      } else if (pendingSerialPort && serialPorts.some((port) => port.path === pendingSerialPort)) {
        sel.value = pendingSerialPort
      }
      pendingSerialPort = ''
      const chosen = sel.selectedOptions[0]
      $('serialLabel').textContent = chosen ? chosen.textContent : '未发现串口'
      const selected = serialPorts.find((port) => port.path === sel.value)
      // 还原时 localStorage 里的用户参数优先；否则用该端口的设备默认值预填。
      if (serialPrefsFromStorage) serialPrefsFromStorage = false
      else if (selected && selected.defaults) applySerialDefaults(selected.defaults)
      updateSerialFrame()
      $('serialHint').textContent = data.available ? '' : ('serialport 不可用：' + (data.error || '未安装') + '（网络功能不受影响）')
    } catch (error) {
      $('serialHint').textContent = '串口列表加载失败：' + error.message
    }
  }

  /* ── 快捷输入（可自定义） ── */
  const QUICK_KEY = 'dsh-comm-quick-v1'
  const quickDefaults = {
    serial: [
      { name: 'AT+GMR', data: 'AT+GMR', mode: 'text' },
      { name: 'AT+RST', data: 'AT+RST', mode: 'text' },
      { name: 'PING', data: 'PING', mode: 'text' },
    ],
    tcpServer: [
      { name: 'GET /', data: 'GET / HTTP/1.1', mode: 'text' },
      { name: 'PING', data: 'PING', mode: 'text' },
    ],
    tcpClient: [
      { name: 'PING', data: 'PING', mode: 'text' },
      { name: 'REBOOT', data: '{"cmd":"reboot"}', mode: 'text' },
    ],
    udp: [
      { name: 'PING', data: 'PING', mode: 'text' },
      { name: 'AA55', data: 'AA 55 01', mode: 'hex' },
    ],
  }
  function cloneQuick(value) { return JSON.parse(JSON.stringify(value)) }
  function loadQuickStore() {
    const store = cloneQuick(quickDefaults)
    try {
      const raw = localStorage.getItem(QUICK_KEY)
      if (raw) {
        const saved = JSON.parse(raw)
        for (const key of Object.keys(store)) if (saved && Array.isArray(saved[key])) store[key] = saved[key]
      }
    } catch { /* ignore */ }
    return store
  }
  function persistQuick(store) {
    try { localStorage.setItem(QUICK_KEY, JSON.stringify(store)) } catch { /* ignore */ }
  }
  const quickStore = loadQuickStore()
  const quickList = () => quickStore[state.mode] || []

  function renderQuick() {
    const row = $('quickRow')
    row.innerHTML = '<span class="quick-label">快捷</span>'
    const list = quickList()
    if (!list.length) {
      const empty = document.createElement('span')
      empty.className = 'quick-empty'
      empty.textContent = '（未配置）'
      row.appendChild(empty)
    }
    for (const item of list) {
      const btn = document.createElement('button')
      btn.className = 'chip'
      btn.textContent = item.name || item.data
      btn.title = (item.mode === 'hex' ? '[HEX] ' : '') + item.data
      btn.addEventListener('click', () => sendPreset(item))
      row.appendChild(btn)
    }
    const edit = document.createElement('button')
    edit.className = 'chip edit'
    edit.textContent = '✎ 编辑'
    edit.addEventListener('click', openQuickEditor)
    row.appendChild(edit)
  }

  function sendPreset(item) {
    const linkId = activeLinkId()
    if (!linkId) { toast('请先打开链路'); return }
    if (item.mode === 'hex') {
      api('/comm/api/write', 'POST', { link: linkId, hex: item.data })
        .then(() => toast('已发送：' + (item.name || item.data)))
        .catch((error) => toast('发送失败：' + error.message))
    } else {
      const text = item.data + eolText()
      api('/comm/api/write', 'POST', { link: linkId, text, encoding: state.enc })
        .then(() => toast('已发送：' + (item.name || item.data)))
        .catch((error) => toast('发送失败：' + error.message))
    }
  }

  function renderQuickEditor() {
    const rows = $('quickRows')
    rows.innerHTML = ''
    if (!quickDraft.length) {
      const empty = document.createElement('div')
      empty.className = 'quick-empty'
      empty.textContent = '还没有快捷项，点「＋ 添加」创建一条。'
      rows.appendChild(empty)
    }
    quickDraft.forEach((item, idx) => {
      const row = document.createElement('div')
      row.className = 'qrow'
      const name = document.createElement('input')
      name.className = 'mini-input'
      name.placeholder = '名称'
      name.value = item.name || ''
      const data = document.createElement('input')
      data.className = 'mini-input'
      data.placeholder = item.mode === 'hex' ? 'AA 55 01' : '要发送的内容'
      data.value = item.data || ''
      const mode = document.createElement('select')
      mode.className = 'qmode'
      mode.innerHTML = '<option value="text">文本</option><option value="hex">HEX</option>'
      mode.value = item.mode === 'hex' ? 'hex' : 'text'
      const del = document.createElement('button')
      del.className = 'qdel'
      del.textContent = '×'
      del.addEventListener('click', () => { quickDraft.splice(idx, 1); renderQuickEditor() })
      name.addEventListener('input', () => { item.name = name.value })
      data.addEventListener('input', () => { item.data = data.value })
      mode.addEventListener('change', () => {
        item.mode = mode.value
        data.placeholder = item.mode === 'hex' ? 'AA 55 01' : '要发送的内容'
      })
      row.appendChild(name); row.appendChild(data); row.appendChild(mode); row.appendChild(del)
      rows.appendChild(row)
    })
  }
  function openQuickEditor() {
    quickDraft = cloneQuick(quickList())
    $('quickModeName').textContent = '· ' + MODE_LABEL[state.mode]
    renderQuickEditor()
    $('quickBackdrop').classList.add('show')
  }
  function closeQuickEditor() { $('quickBackdrop').classList.remove('show') }
  $('quickAdd').addEventListener('click', () => { quickDraft.push({ name: '', data: '', mode: 'text' }); renderQuickEditor() })
  $('quickReset').addEventListener('click', () => { quickDraft = cloneQuick(quickDefaults[state.mode] || []); renderQuickEditor() })
  $('quickCancel').addEventListener('click', closeQuickEditor)
  $('quickClose').addEventListener('click', closeQuickEditor)
  $('quickSave').addEventListener('click', () => {
    const cleaned = quickDraft
      .filter((item) => item.data && item.data.trim())
      .map((item) => ({ name: (item.name || '').trim(), data: item.data.trim(), mode: item.mode === 'hex' ? 'hex' : 'text' }))
    quickStore[state.mode] = cleaned
    persistQuick(quickStore)
    renderQuick()
    closeQuickEditor()
    toast('快捷输入已保存 · ' + cleaned.length + ' 项')
  })
  $('quickBackdrop').addEventListener('click', (event) => { if (event.target === $('quickBackdrop')) closeQuickEditor() })
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeQuickEditor() })

  /* ── 发送 ── */
  function eolText() {
    const value = $('eolSel').value
    if (value === 'LF') return '\n'
    if (value === 'CR') return '\r'
    if (value === '无') return ''
    return '\r\n'
  }
  function setSendMode(hex) {
    state.sendHex = hex
    const input = $('sendInput')
    input.placeholder = hex ? 'HEX：AA 55 01，支持 0x 前缀、空格/逗号分隔' : '输入要发送的数据…（回车发送）'
    $('sendHint').textContent = hex ? 'HEX 发送：按字节解析，不追加行尾' : '文本按所选编码发送；HEX 按字节解析'
    input.classList.remove('invalid')
  }
  $('sendSeg').addEventListener('click', (event) => {

  function timerSpecFromUi() {

      return {
        kind: 'periodic',

        payload: mode === 'hex' ? { hex: raw } : { text: raw, encoding: state.enc },

      }
    }
    const steps = timerDraftSteps
      .filter((step) => step.payload && step.payload.trim())
      .map((step) => ({
        delayMs: Math.max(0, Number(step.delayMs) || 0),
        payload: step.mode === 'hex' ? { hex: step.payload } : { text: step.payload, encoding: state.enc },
      }))
    return {
      kind: 'sequence',
      steps,
      loop: $('timerLoop').checked,
      repeat: Math.max(0, Number($('timerRepeatSeq').value) || 0),

  }

  function applyTimerSpec(spec) {
    if (!spec || typeof spec !== 'object') return
    lastTimerSpec = spec
    const seq = spec.kind === 'sequence'
    $('timerKindPeriodic').checked = !seq
    $('timerKindSequence').checked = seq
    syncTimerKind()
    if (seq) {
      $('timerLoop').checked = Boolean(spec.loop)
      $('timerRepeatSeq').value = String(spec.repeat || 0)
      timerDraftSteps = (Array.isArray(spec.steps) ? spec.steps : []).map((step) => {
        const payload = (step && step.payload) || {}
        return {
          delayMs: String((step && step.delayMs) || 0),
          payload: payload.hex !== undefined ? payload.hex : (payload.text || ''),
          mode: payload.hex !== undefined ? 'hex' : 'text',
        }
      })
      renderTimerSteps()
    } else {
      $('timerInterval').value = String(spec.intervalMs || 1000)
      $('timerRepeat').value = String(spec.repeat || 0)
      const payload = spec.payload || {}
      const isHex = payload.hex !== undefined
      $('timerPayloadMode').value = isHex ? 'hex' : 'text'
      $('timerPayload').value = isHex ? payload.hex : (payload.text || '')
    }
  }

  function applyTimerState(timer) {
    currentTimer = timer || null
    const el = $('timerStat')
    if (!el) return
    if (currentTimer && currentTimer.running) {
      const kind = currentTimer.kind || (lastTimerSpec && lastTimerSpec.kind) || 'periodic'
      const err = currentTimer.lastError ? ' · ' + currentTimer.lastError : ''
      if (kind === 'sequence') {
        const round = currentTimer.round ? ' · 第 ' + currentTimer.round + ' 轮' : ''
        el.textContent = '序列 · 已发 ' + (currentTimer.sent || 0) + round + err
      } else {
        const fallback = lastTimerSpec && lastTimerSpec.kind === 'periodic' ? lastTimerSpec.intervalMs : ''
        const ms = currentTimer.intervalMs || fallback
        el.textContent = '定时 ' + (ms ? ms + 'ms ' : '') + '· 已发 ' + (currentTimer.sent || 0) + err
      }
    } else if (currentTimer && currentTimer.lastError) {
      el.textContent = '定时失败：' + currentTimer.lastError
    } else {
      el.textContent = lastTimerSpec ? '定时已停' : ''
    }
    const running = Boolean(currentTimer && currentTimer.running
      && (currentTimer.kind || (lastTimerSpec && lastTimerSpec.kind)) === 'periodic')
    if ($('periodic').checked !== running) $('periodic').checked = running
  }

  /* ── 日志导出 / 录制 ── */
  function pad2(n) { return String(n).padStart(2, '0') }
  function fileStamp() {
    const d = new Date()
    return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds())
  }
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url; a.download = name
    document.body.appendChild(a); a.click()
    setTimeout(() => { URL.revokeObjectURL(url); a.remove() }, 200)
  }
  function exportSource() { return recorded.length ? recorded : (logs.get(activeLinkId()) || []) }
  function oneLine(item) {
    const decoded = decodeBytes(item.bytes, state.enc)
    const dir = item.dir === 'tx' ? 'TX' : (item.dir === 'sys' ? 'SYS' : 'RX')
    const peer = item.peer ? ' ' + (item.dir === 'tx' ? 'dst=' : 'src=') + item.peer : ''
    const text = item.x ? '[binary]' : decoded.text.replace(/[\r\n]+/g, '\\n')
    return '[' + fmtTime(item.t) + '] ' + dir + peer + ' | ' + hexOf(item.bytes) + ' | ' + text
  }
  function exportTxt() {
    const list = exportSource()
    if (!list.length) { toast('没有可导出的日志'); return }
    const head = '# DSH 通信调试台日志\n# 模式: ' + MODE_LABEL[state.mode] + '  ' + linkConfigText() + '\n# 编码: ' + state.enc + '\n'
    download('comm-log-' + fileStamp() + '.log', head + list.map(oneLine).join('\n') + '\n', 'text/plain;charset=utf-8')
    toast('已导出 ' + list.length + ' 条日志')
  }
  function csvCell(value) { return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"' }
  function exportCsv() {
    const list = exportSource()
    if (!list.length) { toast('没有可导出的日志'); return }
    const rows = ['time,direction,peer,encoding,text,hex']
    for (const item of list) {
      const decoded = decodeBytes(item.bytes, state.enc)
      rows.push([
        csvCell(fmtTime(item.t)), csvCell(item.dir), csvCell(item.peer),
        csvCell(item.x ? 'binary' : state.enc), csvCell(item.x ? '' : decoded.text), csvCell(hexOf(item.bytes)),
      ].join(','))
    }
    download('comm-log-' + fileStamp() + '.csv', '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8')
    toast('已导出 CSV · ' + list.length + ' 条')
  }
  function exportBin() {
    const list = exportSource().filter((item) => item.dir === 'rx')
    if (!list.length) { toast('没有接收数据可导出'); return }
    let total = 0
    for (const item of list) total += item.bytes.length
    const out = new Uint8Array(total)
    let offset = 0
    for (const item of list) { out.set(item.bytes, offset); offset += item.bytes.length }
    download('comm-rx-' + fileStamp() + '.bin', new Blob([out], { type: 'application/octet-stream' }))
    toast('已导出接收字节 · ' + total + ' B')
  }

  function autoSelect(options, value) {
    const sel = document.createElement('select')
    for (const [val, label] of options) {
      const opt = document.createElement('option')
      opt.value = val
      opt.textContent = label
      sel.appendChild(opt)
    }
    sel.value = value

  }

  function renderAutoRules() {
    const list = $('autoList')
    list.innerHTML = ''
    if (!activeLinkId()) {
      const empty = document.createElement('div')
      empty.className = 'auto-empty'
      empty.textContent = '先用上面的「打开」建立一条链路，规则按链路保存。'

      return

    if (!autoRules.length) {
      const empty = document.createElement('div')

    autoRules.forEach((rule, index) => {
      const row = document.createElement('div')

      const enabled = document.createElement('input')
      enabled.type = 'checkbox'
      enabled.checked = rule.enabled !== false
      enabled.title = '启用'

      const mode = autoSelect([['contains', '包含'], ['regex', '正则'], ['hex', 'HEX']], rule.mode || 'contains')
      mode.title = '匹配方式'
      mode.addEventListener('change', () => { autoRules[index].mode = mode.value })

      const match = document.createElement('input')
      match.type = 'text'

      match.value = rule.match || ''
      match.placeholder = '匹配内容'
      match.addEventListener('input', () => { autoRules[index].match = match.value })

      const arrow = document.createElement('span')

      const reply = document.createElement('input')
      reply.type = 'text'
      reply.className = 'grow'
      reply.value = rule.reply || ''
      reply.placeholder = '回复内容'
      reply.addEventListener('input', () => { autoRules[index].reply = reply.value })

      const enc = autoSelect(ENCODINGS, rule.encoding || state.enc)
      enc.title = '编码'
      enc.addEventListener('change', () => { autoRules[index].encoding = enc.value })

      const delay = document.createElement('input')
      delay.type = 'number'
      delay.className = 'w60'
      delay.min = '0'
      delay.max = '60000'
      delay.value = String(rule.delayMs || 0)

      const target = autoSelect([['sender', '回发送者'], ['all', '广播']], rule.target || 'sender')

      list.appendChild(row)

      const data = await api('/comm/api/rules?link=' + encodeURIComponent(id))
      autoRules = Array.isArray(data.rules) ? data.rules : []
      $('autoEnable').checked = Boolean(data.enabled)
      const debounce = Number(data.debounceMs)
      $('autoDebounce').value = String(Number.isFinite(debounce) ? debounce : 300)
      const aiId = String(data.aiSessionId || '')
      const title = String(data.aiSessionTitle || 'dsh-comm 自动回复')
      if (!data.aiSession) {
        $('autoAiState').textContent = '→ 当前没有可用 DSH 会话，不会回复'
      } else if (aiId && data.aiDedicated !== false) {
        $('autoAiState').textContent = '→ 专用会话「' + title + '」' + aiId + '（不再注入主对话）'
      } else if (aiId) {
        $('autoAiState').textContent = '→ 转给指定会话 ' + aiId + '（不再注入主对话）'
      } else if (data.aiDedicated !== false) {
        $('autoAiState').textContent = '→ 首次自动回复时自动创建专用会话「' + title + '」，不打扰主对话'
      } else {
        $('autoAiState').textContent = '→ 转给最近活跃的 DSH 会话（可能注入主对话）'
      }
    } catch (error) {
      autoRules = []
      toast('读取自动回复规则失败：' + ((error && error.message) || error))
    }
    renderAutoRules()
  }

  async function saveAutoRules() {
    const id = activeLinkId()
    if (!id) { toast('先打开一条链路'); return }
    try {
      const data = await api('/comm/api/rules', 'POST', { link: id, rules: autoRules })
      autoRules = Array.isArray(data.rules) ? data.rules : []
      renderAutoRules()
      // 防抖窗口与开关一起落到 /auto
      try {
        await api('/comm/api/auto', 'POST', { link: id, enabled: $('autoEnable').checked, debounceMs: autoDebounceValue() })
      } catch { /* 老 Host 不支持 debounceMs 时忽略 */ }
      toast('自动回复已保存：' + autoRules.length + ' 条')
    } catch (error) {
      toast('保存失败：' + ((error && error.message) || error))
    }
  }

  $('autoBtn').addEventListener('click', async () => {
    autoOpen = !autoOpen
    $('autoPanel').hidden = !autoOpen
    if (autoOpen) { lastAutoLink = activeLinkId(); await loadAutoRules() }
  })
  $('autoAdd').addEventListener('click', () => {
    if (!activeLinkId()) { toast('先打开一条链路'); return }
    autoRules.push({ enabled: true, mode: 'contains', match: '', reply: '', encoding: state.enc, delayMs: 0, target: 'sender' })
    renderAutoRules()
  })
  $('autoSave').addEventListener('click', saveAutoRules)
  $('autoEnable').addEventListener('change', async (event) => {
    const id = activeLinkId()
    if (!id) { event.target.checked = false; toast('先打开一条链路'); return }
    try {
      const data = await api('/comm/api/auto', 'POST', {
        link: id,
        enabled: event.target.checked,
        debounceMs: autoDebounceValue(),
      })
      event.target.checked = Boolean(data.enabled)
      toast(data.enabled ? '自动回复已启用' : '自动回复已关闭')
    } catch (error) {
      event.target.checked = !event.target.checked
      toast('切换失败：' + ((error && error.message) || error))
    }
  })
  $('autoDebounce').addEventListener('change', async () => {
    const value = autoDebounceValue()
    $('autoDebounce').value = String(value)
    saveUiSettings()
    const id = activeLinkId()
    if (!id) return
    try {
      await api('/comm/api/auto', 'POST', { link: id, enabled: $('autoEnable').checked, debounceMs: value })
      toast('防抖窗口已设为 ' + value + 'ms')
    } catch (error) {
      toast('保存防抖失败：' + ((error && error.message) || error))
    }
  })

  /* ── 界面设置持久化（localStorage） ── */
  const UI_SETTINGS_KEY = 'dsh-comm.settings.v1'
  let pendingSerialPort = ''
  let uiSaveTimer = null

  function collectUiSettings() {
    return {
      enc: state.enc,
      hex: state.hex,
      sendHex: state.sendHex,
      ts: state.ts,
      auto: state.auto,
      paused: state.paused,
      filter: state.filter,
      eol: $('eolSel').value,
      periodMs: $('periodMs').value,
      periodic: $('periodic').checked,
      autoDebounce: $('autoDebounce').value,
      autoOpen,
      mode: state.mode,
      cfg: {
        serial: {
          port: $('serialPort').value,
          baud: $('serialBaud').value,
          dataBits: $('serialDataBits').value,
          parity: $('serialParity').value,
          stopBits: $('serialStopBits').value,
          flow: $('serialFlow').value,
          dtr: $('serialDtr').checked,
          rts: $('serialRts').checked,
          autoReconnect: $('serialAutoReconnect').checked,
        },
        tcpServer: { host: $('tsHost').value, port: $('tsPort').value },
        tcpClient: { host: $('tcHost').value, port: $('tcPort').value },
        udp: {
          localHost: $('udpLocalHost').value,
          localPort: $('udpLocal').value,
          host: $('udpHost').value,
          port: $('udpPort').value,
        },
      },
    }
  }

  function saveUiSettings() {
    clearTimeout(uiSaveTimer)
    uiSaveTimer = setTimeout(() => {
      try { localStorage.setItem(UI_SETTINGS_KEY, JSON.stringify(collectUiSettings())) } catch { /* ignore */ }
    }, 200)
  }

  function restoreUiSettings() {
    let saved = null
    try { saved = JSON.parse(localStorage.getItem(UI_SETTINGS_KEY) || 'null') } catch { saved = null }
    if (!saved || typeof saved !== 'object') return
    if (typeof saved.enc === 'string') state.enc = saved.enc
    state.ts = saved.ts !== false
    state.auto = saved.auto !== false
    state.paused = Boolean(saved.paused)
    state.filter = typeof saved.filter === 'string' ? saved.filter : ''
    $('tTs').checked = state.ts
    $('tAuto').checked = state.auto
    $('tPause').checked = state.paused
    $('filterInput').value = state.filter
    if (typeof saved.eol === 'string') $('eolSel').value = saved.eol
    if (typeof saved.periodMs === 'string') $('periodMs').value = saved.periodMs
    if (saved.autoDebounce !== undefined) $('autoDebounce').value = String(saved.autoDebounce)
    $('periodic').checked = Boolean(saved.periodic)
    $('eolLabel').textContent = $('eolSel').value
    const cfg = saved.cfg || {}
    if (cfg.tcpServer) {
      if (cfg.tcpServer.host) $('tsHost').value = cfg.tcpServer.host
      if (cfg.tcpServer.port) $('tsPort').value = cfg.tcpServer.port
    }
    if (cfg.tcpClient) {
      if (cfg.tcpClient.host) $('tcHost').value = cfg.tcpClient.host
      if (cfg.tcpClient.port) $('tcPort').value = cfg.tcpClient.port
    }
    if (cfg.udp) {
      if (cfg.udp.localHost) $('udpLocalHost').value = cfg.udp.localHost
      if (cfg.udp.localPort) $('udpLocal').value = cfg.udp.localPort
      if (cfg.udp.host) $('udpHost').value = cfg.udp.host
      if (cfg.udp.port) $('udpPort').value = cfg.udp.port
    }
    if (cfg.serial) {
      const s = cfg.serial
      if (s.baud) setSerialBaud(s.baud)
      if (s.dataBits) $('serialDataBits').value = String(s.dataBits)
      if (s.parity) $('serialParity').value = String(s.parity)
      if (s.stopBits) $('serialStopBits').value = String(s.stopBits)
      if (s.flow) $('serialFlow').value = String(s.flow)
      if (typeof s.dtr === 'boolean') $('serialDtr').checked = s.dtr
      if (typeof s.rts === 'boolean') $('serialRts').checked = s.rts
      if (typeof s.autoReconnect === 'boolean') $('serialAutoReconnect').checked = s.autoReconnect
      pendingSerialPort = s.port || ''
      // localStorage 里的用户参数优先于端口默认值
      serialPrefsFromStorage = true
      updateSerialFrame()
    }
    state.sendHex = Boolean(saved.sendHex)
    setSendMode(state.sendHex)
    for (const btn of $('sendSeg').children) btn.classList.toggle('active', (btn.dataset.mode === 'hex') === state.sendHex)
    state.hex = Boolean(saved.hex)
    for (const btn of $('modeSeg').children) btn.classList.toggle('active', (btn.dataset.mode === 'hex') === state.hex)
    if (typeof saved.mode === 'string') state.mode = saved.mode
    if (saved.autoOpen) { autoOpen = true; $('autoPanel').hidden = false }
  }

  // 任何控件变动都落盘（规则面板里的输入由「保存」按钮写入 Host，这里跳过）
  document.addEventListener('change', saveUiSettings)
  document.addEventListener('input', (event) => {
    if (event.target.closest && event.target.closest('.auto-panel')) return
    saveUiSettings()
  })

  /* ── 初始化 ── */
  for (const [value, label] of ENCODINGS) {
    const opt = document.createElement('option')
    opt.value = value
    opt.textContent = label
    $('encSel').appendChild(opt)
  }
  restoreUiSettings()
  $('encSel').value = state.enc
  updateSerialFrame()
  applyMode(state.mode || 'serial')
  updateRecordUI()
  poll()
  if (autoOpen) { lastAutoLink = activeLinkId(); loadAutoRules() }
})()
</script>
</body>
</html>
